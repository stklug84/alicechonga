# _config.yml

---
title: "Alice Chonga - International HR Strategist"
description: |
  "Global HR for a Changing World. Building inclusive, ethical, and future-ready
  HR systems across cultures and continents."
author: "Alice Chonga"
url: "https://alicechonga.com"

navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Services
    url: /services/
  - title: Blog
    url: /blog/
  - title: Speaking
    url: /speaking/
  - title: Resources
    url: /resources/
  - title: Contact
    url: /contact/

# Blog / posts
permalink: /blog/:year/:month/:day/:title/
paginate: 10

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
